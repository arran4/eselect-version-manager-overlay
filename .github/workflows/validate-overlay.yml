name: Validate Portage overlay

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out overlay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate production versus fixture boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat profiles/repo_name)" = 'eselect-version-manager-overlay'
          test "$(cat tests/portage-overlay/profiles/repo_name)" = 'eselect-version-manager-fixtures'
          test -f app-eselect/eselect-version-manager/eselect-version-manager-0.1.0.ebuild
          test -f tests/portage-overlay/dev-lang/go/go-1.22.4.ebuild
          test -f tests/portage-overlay/dev-lang/go/go-1.23.1.ebuild
          test ! -d dev-lang/go
          test ! -d net-libs/nodejs
          if grep -R --include='*.ebuild' -l 'Mocked Go toolchain package' app-eselect; then
            echo 'Mock toolchain ebuild found in production overlay' >&2
            exit 1
          fi
          bash -n tests/portage-overlay/app-misc/version-manager-fixture/*.ebuild
          bash -n tests/portage-overlay/app-misc/unslotted-fixture/*.ebuild
          bash -n tests/portage-overlay/dev-lang/go/*.ebuild
          bash -n app-eselect/eselect-version-manager/*.ebuild
      - name: Set up Go for G2
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.0'
      - name: Validate workflow definitions with actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color=false

      - name: Install G2 (reviewed release)
        run: go install github.com/arran4/g2/cmd/g2@v0.0.107
      - name: G2 repository lint
        run: |
          set -euo pipefail
          # The standalone Ubuntu job does not have a populated Gentoo master
          # repository, so LicenseExists cannot resolve Gentoo's own licenses.
          # This check remains Portage's responsibility in Gentoo container E2E;
          # do not suppress any other license checks.
          # Only the two missing-Manifest rules are exempt for unpublished v0.1.0.
          if [ -f app-eselect/eselect-version-manager/Manifest ]; then
            "$(go env GOPATH)/bin/g2" lint repo -format github-actions -fail-severity error -disable-rule LicenseExists .
            "$(go env GOPATH)/bin/g2" manifest verify .
          else
            echo "::warning::Manifest absent for unpublished v0.1.0; only missing-Manifest rules are temporarily exempt"
            "$(go env GOPATH)/bin/g2" lint repo -format github-actions -fail-severity error -disable-rule MissingManifest,ManifestChecks,LicenseExists .
          fi

  tagged-archive-install:
    name: Install newest released ebuild from matching tagged archive
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out candidate overlay changes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate-overlay

      - name: Determine newest stable versioned package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          package_dir=candidate-overlay/app-eselect/eselect-version-manager
          version="$(find "$package_dir" -maxdepth 1 -type f \
            -name 'eselect-version-manager-[0-9]*.ebuild' -printf '%f\n' |
            sed -nE 's/^eselect-version-manager-([0-9]+\.[0-9]+\.[0-9]+)\.ebuild$/\1/p' |
            sort -V | tail -n 1)"
          test -n "$version" || {
            echo 'No stable versioned eselect-version-manager ebuild found' >&2
            exit 1
          }
          test -f "$package_dir/eselect-version-manager-$version.ebuild"
          echo "Selected matching immutable source tag: v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out corresponding upstream source tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: arran4/eselect-version-manager
          ref: v${{ steps.package.outputs.version }}
          path: source

      - name: Copy candidate overlay into upstream Docker context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source/overlay
          cp -a candidate-overlay/. source/overlay/
          rm -rf source/overlay/.git

      - name: Verify matching source and ebuild inputs
        shell: bash
        env:
          VM_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          test -f source/Makefile
          file="source/overlay/app-eselect/eselect-version-manager/eselect-version-manager-$VM_VERSION.ebuild"
          test -f "$file"
          grep -q '^src_compile()' "$file"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install and integration-test the matching tagged release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./source
          file: ./source/Dockerfile
          target: e2e
          platforms: linux/amd64
          push: false
          build-args: |
            VM_VERSION=${{ steps.package.outputs.version }}
            VM_SOURCE=release
          cache-from: type=gha,scope=eselect-gentoo-e2e
          cache-to: type=gha,scope=eselect-overlay-tagged-e2e,mode=max,ignore-error=true
